name: Diagnose Whisper
on:
  workflow_dispatch:
  push:
    paths: ["tools/diag_whisper.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install -r requirements.txt
      - run: python tools/diag_whisper.py 2>&1 | tee ci.log
      - if: always()
        run: |
          mkdir -p /tmp/out && cp ci.log /tmp/out/ && cd /tmp/out && git init -q && git checkout -q -b x
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "logs diag ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" x:ci-logs-diag
