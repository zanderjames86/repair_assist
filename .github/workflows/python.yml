name: Python models and web app

on:
  push:
    paths-ignore: ["android/**", "**.md"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt pytest
      - name: Tests (data, ML models, OCR on demo photos, Android export parity, Streamlit app)
        run: pytest -v --junitxml=pytest-report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: pytest-report, path: pytest-report.xml }
