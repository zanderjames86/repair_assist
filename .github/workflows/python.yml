name: Python models and web app

on:
  push:
    paths-ignore: ["android/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y tesseract-ocr espeak-ng ffmpeg
      - run: pip install -r requirements.txt pytest pytest-timeout
      - name: Tests (data, ML models, OCR on demo photos, Android export parity, Streamlit app)
        run: set -o pipefail; pytest -v --timeout=600 --junitxml=pytest-report.xml 2>&1 | tee ci.log
      - name: Publish failure log to the ci-logs branch
        if: failure()
        run: |
          mkdir -p /tmp/out && cp ci.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "logs ${{ github.workflow }} ${{ github.run_id }} ${{ github.job }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs:ci-logs-${{ github.job }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: pytest-report, path: pytest-report.xml }
